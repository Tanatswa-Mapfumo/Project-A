name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fitness
          POSTGRES_PASSWORD: fitness
          POSTGRES_DB: fitness
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fitness"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint (Ruff)
        run: ruff check .

      - name: Run tests
        run: pytest

      - name: Verify migrations against PostgreSQL
        env:
          DATABASE_URL_SYNC: postgresql+psycopg://fitness:fitness@localhost:5432/fitness
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

      - name: Verify app imports
        run: python -c "from app.main import app; print('app ok')"
